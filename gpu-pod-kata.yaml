apiVersion: v1
kind: Pod
metadata:
    name: gpu-pod-kata
    labels:
        app: qwen-vllm
    #annotations:
    #prometheus.io/scrape: "true"
    #prometheus.io/port: "8000" # 与暴露的端口一致（fastapi监听的）
    #prometheus.io/path: "/metrics"
    #annotations:
    #io.katacontainers.config.hypervisor.default_vcpus: "16"
    # io.katacontainers.config.hypervisor.default_memory: "65536"

spec:
    runtimeClassName: kata-qemu-nvidia-gpu
    restartPolicy: Never
    containers:
        - name: cuda-container
          # image: qwen3-vllm
          image: docker.io/vllm/vllm-openai:v0.20.1-cu129-ubuntu2404
          # image: qwen3-4b-vllm
          #env:
          #- name: NVIDIA_VISIBLE_DEVICES  # 手动注入
          #  value: "0,1"
          #command: ["vllm", "serve", "/model", "--tensor-parallel-size", "1", "--host", "0.0.0.0", "--port", "8000"]
          command:
              - bash
              - -lc
              - |
                  echo "=== preflight ==="
                  hostname
                  cat /proc/self/status | grep -E 'Cpus_allowed_list|Mems_allowed_list|Seccomp'
                  cat /sys/fs/cgroup/cpuset.cpus.effective 2>/dev/null || true
                  cat /sys/fs/cgroup/cpuset.mems.effective 2>/dev/null || true
                  nvidia-smi -L
                  echo "=== start vLLM ==="
                  exec vllm serve /model \
                    --tensor-parallel-size 2 \
                    --host 0.0.0.0 \
                    --port 8000 \
                    --max-num-batched-tokens 8192 \
                    --max-model-len 8192
          imagePullPolicy: Never
          resources:
              limits:
                  cpu: "16"
                  memory: "56Gi"
<<<<<<< Updated upstream
                #   hugepages-2Mi: "64Gi"
                  nvidia.com/pgpu: 2
=======
                  nvidia.com/pgpu: 1
>>>>>>> Stashed changes
              requests:
                  cpu: "16"
                  memory: "56Gi"
                  nvidia.com/pgpu: 2
          ports:
              - containerPort: 8000
          volumeMounts: # <-- 新增：容器内挂载配置
              - name: model-volume
                mountPath: /model # 对应脚本中的 CONTAINER_MODEL_DIR
                readOnly: true # 脚本中 options=rbind:ro
              - name: trace-volume
                mountPath: /traces # 对应脚本中的 CONTAINER_TRACE_DIR
                # 默认读写，不需要显式声明 readOnly
    volumes: # <-- 新增：卷定义
        - name: model-volume
          hostPath:
              path: /home/liulei/models/Qwen/Qwen3.5-0.8B # 对应脚本中的 MODEL_DIR
              type: Directory # 必须为已存在的目录（脚本已检查）
        - name: trace-volume
          hostPath:
              path: /data/home/liulei/TcProject/ctr-container/traces # 对应脚本中的 TRACE_DIR
              type: DirectoryOrCreate # 不存在时自动创建，允许读写

    tolerations:
        - key: nvidia.com/pgpu
          operator: Exists
          effect: NoSchedule
